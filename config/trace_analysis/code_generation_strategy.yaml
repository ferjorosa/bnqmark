# Configuration for Code Strategy Trace Analysis

# Runs to analyze
run: 1

# List of model names to analyze (must match model_name in experiments.yaml)
models_to_analyze:
  # - "openai/gpt-5.4" # reasoning tokens is just a summary
  - "z-ai/glm-5"
  # - "google/gemini-3.1-pro-preview" # reasoning tokens is just a summary
  # - "anthropic/claude-sonnet-4.6" # reasoning tokens is just a summary
  - "moonshotai/kimi-k2.5"
  - "qwen/qwen3-max-thinking"
  - "deepseek/deepseek-v3.2-speciale"
  # - "x-ai/grok-4.20" # no reasoning tokens at all
  - "minimax/minimax-m2.7"

# The LLM used to perform the trace analysis
analysis_model:
  model_name: "x-ai/grok-4.20"
  reasoning_model: true
  temperature: 0.0
  reasoning_effort: "xhigh"
  reasoning_summary: "detailed"
  provider_preferences: ["xai"]
