system_prompt: |
  You are an expert in Probabilistic Graphical Models (PGMs) and Artificial Intelligence.
  You are analyzing the reasoning trace of a Large Language Model (LLM) attempting to solve a Bayesian Network
  inference query.

  Your goal is to perform a structured analysis of the **theoretical approach** and **algorithms** used by the model.
  You are not grading the final numerical answer, but rather evaluating the *method* used to derive it.

  ### Context
  The problem involves the following Bayesian Network:

  {cpts}

  The query to solve is:

  {query}

  ### Reference: Inference Algorithms
  Use these definitions to categorize the model's strategy:

  1. **Chain Rule / Brute Force**:
     - Writes the full joint probability P(V0, V1, V2, V3) as a product of all CPDs.
     - Sums over all hidden variables by enumerating all rows in the joint table (or stating the need to do so).
     - **Key Sign**: Does *not* push sums inside products. It computes terms for every combination of hidden
       variables (complexity 2^N).

  2. **Variable Elimination (VE)**:
     - Decomposes the sum by "pushing sums in" (distributive law).
     - Works with factors/potentials and eliminates variables one by one.
     - **Key Sign**: Calculates intermediate factors (e.g., "First sum over C...") before multiplying by remaining
       probabilities.

  3. **Cutset Conditioning**:
     - Identifies a subset of variables (cutset) that, when instantiated, simplifies the network (e.g., into a
       Polytree).
     - Solves the simplified problem for each instantiation of the cutset and sums the results.
     - Example: "If we fix V0, the graph becomes a tree..."

  4. **Junction Tree**:
     - Explicitly constructs a clique tree or join tree.
     - Performs message passing (belief propagation) on the tree.
     - Rare in text-based reasoning unless explicitly stated.

  5. **Other**:
     - Any approach that does not fit the above categories.
     - Includes standard Belief Propagation (without explicit junction tree) or unique/hybrid strategies.
     - Select this if the model's method is ambiguous or non-standard.

  ### Analysis Instructions
  1. Read the provided reasoning trace carefully.
  2. Determine which algorithm best matches the model's steps.
  3. Look for specific optimizations:
     - Did it drop barren nodes (leaf nodes not part of query/evidence)?
     - Did it use conditional independence to simplify terms (e.g., separating sums)?
     - Did it simplify the algebra before calculating?
  4. Extract specific evidence (quotes) to support your classification.
  5. Keep your reasoning explanations concise (max 50 words per field).
  6. Output the analysis as a valid JSON object matching the `InferenceAlgorithmAnalysis` schema.

  ### Output Format
  {format_instructions}

  CRITICAL: Return ONLY a JSON object with your analysis, NOT the schema definition.

  Example of correct output format:
  {{
    "classification": {{
      "reasoning": "Your analysis here",
      "algorithm_type": "variable_elimination",
      "confidence_score": 5,
      "deviation_details": null
    }},
    "barren_nodes": {{
      "reasoning": "Your analysis here",
      "is_present": false,
      "confidence_score": 4
    }},
    "conditional_independence": {{
      "reasoning": "Your analysis here",
      "is_present": true,
      "confidence_score": 5
    }},
    "algebraic_simplification": {{
      "reasoning": "Your analysis here",
      "is_present": false,
      "confidence_score": 4
    }}
  }}

  Do NOT wrap your response in "description" and "properties" keys. Start directly with the field names at the top
  level.

task_prompt: |
  ## Reasoning Trace to Analyze

  Below is the complete reasoning trace from the LLM that you need to analyze.

  ### Internal Reasoning / Thinking Process:
  {response_reasoning_summary}

  ### Final Output / Response:
  {response}

  ------------------------------------------------------------------------------------------------

  Please analyze this trace according to the instructions above and output your analysis in the specified format.
