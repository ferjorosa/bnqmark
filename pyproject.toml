[project]
name = "bnqmark"
version = "0.1.0"
description = "BNqMark: A benchmark for evaluating LLMs on exact probabilistic inference in Bayesian Networks"
readme = "README.md"
requires-python = ">=3.12.3"

dependencies = [
    "torch>=2.0.0",
    "pgmpy>=1.0.0",
    "matplotlib>=3.10.8",
    "pyarrow>=23.0.1",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.12.0",
    "pydantic>=2.12.5",
    "openai>=2.30.0",
    "seaborn>=0.13.2",
    "datasets>=4.8.4",
    "huggingface-hub>=1.12.0",
    "statsmodels>=0.14.0",
]

# Explicitly use CPU-only PyTorch to avoid pulling in CUDA dependencies (not needed)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Pin torch packages to use the CPU-only index
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

# Make the project a package
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Make src importable as a package
[tool.hatch.build.targets.wheel.sources]
"src" = ""
