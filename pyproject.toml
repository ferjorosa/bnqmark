[project]
name = "probabilistic-inference-llms"
version = "0.1.0"
description = "Investigate LLM capabilities for probabilistic inference"
readme = "README.md"
requires-python = ">=3.12.3"

dependencies = [
    "torch>=2.0.0",
    "pgmpy>=1.0.0",
    "matplotlib>=3.10.8",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.12",
    "pyarrow>=23.0.1",
]

# Explicitly use CPU-only PyTorch to avoid pulling in CUDA dependencies (not needed)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Pin torch packages to use the CPU-only index
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

# Make the project a package
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
